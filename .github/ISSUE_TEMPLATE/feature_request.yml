name: Feature Request
description: Suggest an idea or enhancement for Excalibur
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new pentest tool, inspector feature, or UI capability? Let us know!
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - "Traffic Interceptor / Repeater"
        - "DOM / Rendering Engine"
        - "Scripting (QuickJS / Lua)"
        - "Fuzzer / Intruder"
        - "GUI Interface (egui)"
        - "Terminal Interface (ratatui)"
        - "Network & TLS (JA3/JA4, HTTP/2)"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation you are facing.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you've considered (e.g. how other tools like Burp Suite or Caido do this).
