name: Bug Report
description: Create a report to help us improve Excalibur
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in Excalibur!
  - type: input
    id: version
    attributes:
      label: Excalibur Version
      description: What version of Excalibur are you running? (Run `excalibur --version`)
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Interface Mode
      description: Which mode were you using when the bug occurred?
      options:
        - "Native GUI"
        - "Terminal TUI"
        - "CLI Subcommand (scan, fuzz, repeat, etc.)"
        - "MITM Proxy Engine"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Launch `excalibur ...`
        2. Navigate to '...'
        3. Click '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
