[workspace]
resolver = "2"
members = [
    "crates/excalibur-core",
    "crates/excalibur-proxy",
    "crates/excalibur-dom",
    "crates/excalibur-script",
    "crates/excalibur-audit",
    "crates/excalibur-gui",
    "crates/excalibur-tui",
    "crates/excalibur-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Zeo120 <bhargavnarumanchi779@gmail.com>"]
license = "MIT"
repository = "https://github.com/Zeo120/Excalibur"
homepage = "https://github.com/Zeo120/Excalibur"
readme = "README.md"
description = "Security-focused non-Chromium browser workbench for development and penetration testing"

[workspace.dependencies]
# Async Runtime & Networking
tokio = { version = "1.43", features = ["full"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1.10"
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "0.26"
rcgen = "0.13" # Dynamic CA and TLS certificate generation for MITM
url = "2.5"

# Database & Storage
rusqlite = { version = "0.33", features = ["bundled"] }

# HTML / DOM / Parsing
html5ever = "0.29"
markup5ever_rcdom = "0.3"
selectors = "0.26"
kuchiki = "0.8"

# Scripting Engines
rquickjs = { version = "0.9", features = ["classes", "macro", "chrono"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }

# GUI & Graphics
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "glow"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }

# Terminal UI
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# Utilities & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
uuid = { version = "1.14", features = ["v4", "serde"] }
webbrowser = "1.2"
